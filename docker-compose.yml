services:
  app:
    image: ${IMAGE:-ghcr.io/gamedevnifemi/pokerion:latest}
    restart: unless-stopped
    volumes:
      - pokerion_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/games', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s   
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"   
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  pokerion_data:
  caddy_data:
  caddy_config:
